:root{
  --orange:#F7931A; --orange-press:#E2850F; --on-orange:#000;
  --bg:#F4F4F4; --hero:#F7931A; --surface:#FFFFFF; --surface-2:#ECECEC;
  --ink:#111111; --muted:#5C5C5C; --line:#E2E2E2; --line-2:#ECECEC;
  --pos:#17773A; --pos-bg:rgba(23,119,58,.11); --neg:#B42318; --neg-bg:rgba(180,35,24,.10);
  --warn:#8F4D00; --warn-bg:rgba(247,147,26,.18); --focus:#000; --overlay:rgba(0,0,0,.45); --cell-miss:#E6E6E6;
  --cell-miss-ink:#6E6E6E; --cell-fut:#D4D4D4; --tip-bg:#111111; --tip-ink:#FFFFFF; --cta:#000000; --on-cta:#FFFFFF; --hero-chip:#FFFFFF; --hero-chip-ink:#5C5C5C;
  --f:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fc:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif-condensed,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --hero:#F7931A; --surface:#141414; --surface-2:#1F1F1F;
  --ink:#F2F2F2; --muted:#A6A6A6; --line:#2A2A2A; --line-2:#1F1F1F;
  --pos:#57C786; --pos-bg:rgba(87,199,134,.14); --neg:#FF8373; --neg-bg:rgba(255,131,115,.13);
  --warn:#F6B45A; --warn-bg:rgba(247,147,26,.16); --focus:#F7931A; --overlay:rgba(0,0,0,.65); --cell-miss:#2A2A2A;
  --cell-miss-ink:#8C8C8C; --cell-fut:#2A2A2A; --tip-bg:#F2F2F2; --tip-ink:#000000; --hero-chip:#000000; --hero-chip-ink:#A6A6A6;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --hero:#F7931A; --surface:#141414; --surface-2:#1F1F1F;
  --ink:#F2F2F2; --muted:#A6A6A6; --line:#2A2A2A; --line-2:#1F1F1F;
  --pos:#57C786; --pos-bg:rgba(87,199,134,.14); --neg:#FF8373; --neg-bg:rgba(255,131,115,.13);
  --warn:#F6B45A; --warn-bg:rgba(247,147,26,.16); --focus:#F7931A; --overlay:rgba(0,0,0,.65); --cell-miss:#2A2A2A;
  --cell-miss-ink:#8C8C8C; --cell-fut:#2A2A2A; --tip-bg:#F2F2F2; --tip-ink:#000000; --hero-chip:#000000; --hero-chip-ink:#A6A6A6;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15.5px;line-height:1.5;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.hide-v{letter-spacing:.12em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- layout ---------- */
#app{max-width:560px;margin:0 auto;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero);display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fc);font-weight:800;font-size:21px;letter-spacing:.01em;text-decoration:none;border:0;background:none;padding:0}
.brand img{width:36px;height:auto;display:block}
.top-actions{display:flex;gap:4px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:24px;height:24px}
main{padding-bottom:96px}
.page-head{display:flex;align-items:center;gap:4px;padding:8px 12px 0 6px}
.page-head h1{font-family:var(--fc);font-weight:800;font-size:26px;margin:0;line-height:1.1}
.sec{padding:22px 20px 6px}
.sec-t{font-family:var(--fc);font-weight:700;font-size:22px;line-height:1.15;margin:0 0 12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head .link-btn{flex:none}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.lead{font-size:17px;line-height:1.45}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.divider{height:1px;background:var(--line);margin:18px 0}
p{margin:0 0 12px}

/* ---------- hero ---------- */
.hero{background:var(--hero);padding:6px 20px 22px}
.hero-label{font-size:15px;color:var(--muted);margin:0 0 2px;display:flex;align-items:center;gap:8px}
.stack-num{font-family:var(--fc);font-weight:800;font-size:clamp(48px,15vw,68px);line-height:.92;letter-spacing:-.005em;margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;border:0;background:none;padding:0;text-align:left}
.stack-num .u{font-size:.36em;font-weight:700;color:var(--muted);letter-spacing:.01em}
.hero-sub{font-size:16px;margin:8px 0 10px;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-weight:600;font-size:14.5px}
.chip.pos{background:var(--pos-bg)} .chip.neg{background:var(--neg-bg)} .chip.neutral{background:var(--surface-2);color:var(--muted)}

/* months grid */
.cell.multi::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--on-orange)}
.cell.void{border:0;visibility:hidden}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(247,147,27,.0)}50%{box-shadow:0 0 0 5px rgba(247,147,27,.22)}}
.months-foot{display:flex;justify-content:space-between;align-items:center;margin:10px 0 14px;font-size:13.5px;color:var(--muted);gap:10px}
.legend{display:flex;gap:12px;align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1.5px solid var(--line);vertical-align:-1px;margin-right:4px}
.legend i.d{background:var(--orange);border-color:var(--orange)}

/* ---------- buttons ---------- */
.btn{min-height:50px;border-radius:14px;border:0;padding:0 18px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2;text-align:center}
.btn.block{width:100%}
.btn-p{background:var(--orange);color:var(--on-orange)}
.btn-p:active{background:var(--orange-press)}
.btn-o{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn-q{background:var(--surface-2);color:var(--ink)}
.btn-d{background:transparent;border:1.5px solid var(--neg);color:var(--neg)}
.btn-s{min-height:40px;font-size:14.5px;border-radius:11px;padding:0 13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.link-btn{border:0;background:none;padding:6px 0;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--orange);text-decoration-thickness:2px;text-underline-offset:3px;font-size:15px}

/* ---------- receipt rows ---------- */
.receipt{margin:0;padding:0;list-style:none}
.receipt li{display:flex;align-items:baseline;gap:8px;padding:9px 0}
.receipt .k{min-width:0}
.receipt .dots{flex:1;border-bottom:1.5px dotted var(--line);transform:translateY(-4px);min-width:16px}
.receipt .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.article ul.receipt,.panel ul.receipt{padding-left:0;margin:0}
.receipt .v small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.receipt button.v{border:0;background:none;padding:0;color:inherit;font:inherit;font-weight:600}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.panel + .panel{margin-top:12px}
.note{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:14.5px}
.note b{font-weight:700}
.demo-bar{background:var(--ink);color:var(--bg);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.demo-bar button{background:var(--orange);color:#000;border:0;border-radius:10px;font-weight:700;padding:8px 12px;font-size:13.5px;white-space:nowrap;flex:none}

/* stats grid (aportes header) */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.stats>div{background:var(--surface);padding:12px 14px}
.stats .k{font-size:13px;color:var(--muted)}
.stats .v{font-family:var(--fc);font-weight:700;font-size:23px;line-height:1.15;font-variant-numeric:tabular-nums}
.stats .wide{grid-column:1/-1}

/* list rows */
.yhead{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 4px;border-bottom:2px solid var(--ink)}
.yhead b{font-family:var(--fc);font-size:22px}
.yhead span{font-size:13.5px;color:var(--muted)}
.row-btn{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 0}
.row-btn .a{font-weight:600}
.row-btn .b{font-size:13.5px;color:var(--muted)}
.row-btn .r{text-align:right;font-variant-numeric:tabular-nums}
.row-btn:active{background:var(--surface-2)}
.empty{padding:28px 20px;text-align:left}
.empty h2{font-family:var(--fc);font-size:26px;margin:0 0 6px}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f);font-size:11px;fill:var(--muted)}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:1.6}
.chart .ln2{fill:none;stroke:var(--orange);stroke-width:2.4}
.chart .avg{stroke:var(--ink);stroke-dasharray:4 4;stroke-width:1.2}
.chart .now{stroke:var(--orange);stroke-width:2}
.chart .dot{fill:var(--ink)}
.chart .area{fill:var(--orange);opacity:.14}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.chart-legend i{display:inline-block;width:14px;height:3px;vertical-align:3px;margin-right:5px;background:var(--ink)}
.chart-legend i.o{background:var(--orange);height:4px}
.chart-legend i.d{background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 8px)}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:66px;align-items:stretch}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab .gl{font-size:22px;line-height:24px;height:24px}
.tab.on{color:var(--ink)}
.tab.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--orange)}
.fab-wrap{display:flex;align-items:center;justify-content:center}
.fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--orange);color:#000;display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 0 0 5px var(--bg)}
.fab svg{width:28px;height:28px}
.fab:active{background:var(--orange-press)}

/* ---------- sheet ---------- */
.ov{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet:focus{outline:none}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:24px 24px 0 0;padding:6px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet.closing{animation:down .16s ease-in forwards}
.ov.closing{animation:fadeout .16s ease-in forwards}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:6px auto 10px}
.sheet h2{font-family:var(--fc);font-weight:800;font-size:27px;line-height:1.1;margin:4px 0 6px}
.sheet .sub{color:var(--muted);margin:0 0 16px;font-size:14.5px}
.sheet-x{position:sticky;top:0;float:right;margin:-2px -8px 0 0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes down{to{transform:translateY(60px);opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}

/* fields */
.field{display:block;margin:0 0 14px}
.field>label,.field>.lbl{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin:0 0 6px}
.inp,select.inp,textarea.inp{width:100%;min-height:50px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:11px 13px;appearance:none;-webkit-appearance:none}
textarea.inp{min-height:84px;resize:vertical}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.inp:focus{outline:2px solid var(--focus);outline-offset:1px}
.inp.big{font-family:var(--fc);font-weight:700;font-size:28px;min-height:60px}
.inp-wrap{position:relative}
.inp-wrap .suf{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}
.inp-wrap .inp{padding-right:58px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.calc-line{background:var(--surface-2);border-radius:13px;padding:12px 14px;margin:0 0 14px;font-variant-numeric:tabular-nums}
.calc-line b{font-family:var(--fc);font-size:22px;font-weight:800}
.err{color:var(--neg);font-size:14px;font-weight:600;margin:0 0 12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2)}
.seg button{border:0;background:transparent;border-radius:10px;min-height:42px;font-weight:600;font-size:14.5px;color:var(--muted);padding:0 8px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch .t{font-weight:600}
.switch .d{font-size:13.5px;color:var(--muted);font-weight:400}
.tog{width:52px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tog.on{background:var(--orange)}
.tog.on::after{transform:translateX(20px)}
.set-group{margin:0 0 22px}
.set-group h3{font-family:var(--fc);font-size:20px;margin:0 0 4px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font-size:15.5px}
.set-row .v{color:var(--muted);font-size:14.5px;text-align:right}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.chip-btn.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);border-radius:13px;padding:11px 15px;font-weight:600;font-size:14.5px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25);animation:up .2s ease-out}

/* ---------- carteira / utxo ---------- */
.split{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--line);margin:10px 0 8px}
.split .ex{background:var(--muted)} .split .self{background:var(--orange)}
.split-legend{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.split-legend b{display:block;font-family:var(--fc);font-size:21px;font-variant-numeric:tabular-nums}
.split-legend .r{text-align:right}
.meter{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.meter>i{display:block;height:100%;background:var(--orange);border-radius:999px}
.utxo{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 0}
.utxo .g{font-size:24px;line-height:1;color:var(--orange);grid-row:1/3;width:28px;text-align:center}
.utxo .amt{font-weight:700;font-variant-numeric:tabular-nums}
.utxo .lbl{font-size:13.5px;color:var(--muted);grid-column:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.utxo .cost{grid-row:1/3;grid-column:3;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.utxo.spent{opacity:.5}
.utxo.sel{background:var(--warn-bg)}
.utxo .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:inline-grid;place-items:center;font-size:15px}
.utxo.sel .ck{background:var(--orange);border-color:var(--orange);color:#000}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.dot.ok{background:var(--pos)} .dot.mid{background:var(--orange)} .dot.bad{background:var(--neg)}
.tags{display:inline-flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--surface-2);color:var(--muted);letter-spacing:.01em}
.tag.k{background:var(--warn-bg);color:var(--warn)}
.tag.f{background:var(--ink);color:var(--bg)}
.range{width:100%;accent-color:var(--orange);height:32px}
.selbar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px 12px;margin:12px 0}
.selbar .sb-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;margin:0 0 8px}
.selbar .sb-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.selbar .btn{min-height:42px;font-size:14px;padding:0 8px}
.selbar .btn-q{background:var(--bg);color:var(--ink)}
.wallet-chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:8px 11px;font-weight:600;font-size:14px;background:var(--surface)}

/* ---------- aprender ---------- */
.progress{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:var(--line)} .ring .fgc{stroke:var(--orange);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{font-family:var(--fc);font-weight:800;font-size:19px;fill:var(--ink)}
.lesson{display:grid;grid-template-columns:40px 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 0}
.lesson .n{grid-row:1/3;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--fc);font-weight:800;font-size:17px}
.lesson.done .n{background:var(--orange);border-color:var(--orange);color:#000}
.lesson .t{font-weight:700}
.lesson .s{font-size:13.5px;color:var(--muted);grid-column:2}
.lesson .chev{grid-row:1/3;grid-column:3;color:var(--muted)}
.article{padding:6px 20px 10px}
.article h2.lt{font-family:var(--fc);font-weight:800;font-size:32px;line-height:1.05;margin:8px 0 8px}
.article .ls{font-size:17px;color:var(--muted);margin:0 0 18px}
.article h3{font-family:var(--fc);font-size:21px;margin:22px 0 8px}
.article p{font-size:16.5px;line-height:1.6;max-width:62ch}
.article ul{margin:0 0 14px;padding-left:20px;font-size:16.5px;line-height:1.55}
.article li{margin:0 0 6px}
.tip{border-left:4px solid var(--orange);background:var(--surface-2);border-radius:0 14px 14px 0;padding:12px 14px;margin:16px 0;font-size:15.5px}
.tip .btn{margin-top:10px}
.quiz{margin:26px 0 8px;padding:16px;border-radius:18px;border:2px solid var(--ink)}
.quiz h3{margin:0 0 12px !important}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:12px 14px;margin:0 0 8px;font-size:15.5px;font-weight:500}
.opt.right{border-color:var(--pos);background:var(--pos-bg)}
.opt.wrong{border-color:var(--neg);background:var(--neg-bg)}
.why{font-size:15px;margin:8px 0 0}
.gl-item{padding:12px 0;border-bottom:1px solid var(--line)}
.gl-item b{display:block;font-size:16px}
.gl-item span{font-size:14.5px;color:var(--muted)}
.links a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
.links a b{font-weight:600}
.links a small{display:block;color:var(--muted);font-size:13px}
.links a .ext{color:var(--muted);flex:none}
.tool{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 10px}
.tool b{font-family:var(--fc);font-size:20px;font-weight:700}
.tool span{font-size:14px;color:var(--muted);grid-column:1}
.tool .chev{grid-row:1/3;grid-column:2;font-size:20px}

/* KriptoBR: cartões no padrão visual da marca (verde-água, azul, marinho e grafite; logo oficial) */
:root{--kbr-teal:#00C69F;--kbr-blue:#05668D;--kbr-navy:#143642;--kbr-ink:#313131;--kbr-muted:#5b6b71;--kbr-bg:#fff;--kbr-line:#dbe6e9;--kbr-tile:#e8f8f3;--kbr-fill:#fff;--kbr-deep:#143642;--kbr-slot:#143642;--kbr-cta:#143642;--kbr-cta-ink:#fff}
:root[data-theme="dark"]{--kbr-ink:#f1f5f6;--kbr-muted:#a8bbc1;--kbr-bg:#0f2329;--kbr-line:#23424c;--kbr-tile:#143642;--kbr-fill:#1d4b59;--kbr-deep:#0b1d22;--kbr-slot:#00C69F;--kbr-cta:#00C69F;--kbr-cta-ink:#0b1d22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--kbr-ink:#f1f5f6;--kbr-muted:#a8bbc1;--kbr-bg:#0f2329;--kbr-line:#23424c;--kbr-tile:#143642;--kbr-fill:#1d4b59;--kbr-deep:#0b1d22;--kbr-slot:#00C69F;--kbr-cta:#00C69F;--kbr-cta-ink:#0b1d22}}
.ks{display:block;margin:14px 0;padding:14px 16px 16px;border:1px solid var(--kbr-line);border-radius:18px;background:var(--kbr-bg);color:var(--kbr-ink);text-decoration:none;box-shadow:0 1px 3px rgba(20,54,66,.07)}
.ks-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px;margin-bottom:12px}
.kbr-logo{display:block;width:84px;height:26px;color:var(--kbr-ink)}
.ks-by{font-size:12px;font-weight:600;color:var(--kbr-muted)}
.ks-brand{display:block;width:76px;height:43px;background:var(--kbr-ink);-webkit-mask:var(--m) right center/contain no-repeat;mask:var(--m) right center/contain no-repeat}
.ks-body{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center}
.ks-art{width:84px;height:84px;border-radius:16px;background:var(--kbr-tile);display:grid;place-items:center}
.ks-art svg{width:74px;height:74px;display:block}
.ks b{display:block;font-family:var(--fc);font-size:19px;line-height:1.15;color:var(--kbr-ink)}
.ks p{margin:5px 0 0;font-size:14px;line-height:1.35;color:var(--kbr-muted)}
.ks-go{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:9px 16px;border-radius:999px;background:var(--kbr-cta);color:var(--kbr-cta-ink);font-weight:700;font-size:14px}
.ks-go svg{width:16px;height:16px;display:block}
.ks:active .ks-go{filter:brightness(1.15)}
.ka-l{fill:none;stroke:var(--kbr-teal);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ka-tl{fill:none;stroke:var(--kbr-teal);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ka-wl{fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.ka-f{fill:var(--kbr-fill)}.ka-n{fill:var(--kbr-slot)}.ka-d{fill:var(--kbr-deep)}.ka-b{fill:var(--kbr-teal)}.ka-w{fill:#fff}
.kbr-t::before{content:"";display:inline-block;width:5px;height:.8em;margin-right:10px;border-radius:3px;background:var(--kbr-teal);vertical-align:-1px}

/* lock */
.lock{position:fixed;inset:0;z-index:100;background:var(--hero);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.lock img{width:84px;margin-bottom:12px}
.lock h2{font-family:var(--fc);font-size:26px;margin:0 0 4px}
.pin-dots{display:flex;gap:14px;margin:18px 0 22px;min-height:18px}
.pin-dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--ink)}
.pin-dots i.f{background:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.keypad button{height:76px;border-radius:50%;border:0;background:var(--surface);font-family:var(--fc);font-size:30px;font-weight:700}
.keypad button:active{background:var(--surface-2)}
.keypad .ghost{background:transparent;font-family:var(--f);font-size:14px;font-weight:600}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
@media (min-width:600px){.sheet{border-radius:24px;margin-bottom:24px}.ov{align-items:center}}

.feat{list-style:none;margin:6px 0 16px;padding:0}
.feat li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.feat li::before{content:"◈";color:var(--orange);font-size:17px;line-height:1.35}
.calc-line.over{background:var(--warn-bg);color:var(--warn)}

/* ---------- endereços, transações e histórico (v2) ---------- */
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:0}
.inp.mono{font-size:14px}
.addr-str{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13.5px;line-height:1.5;word-break:break-all;background:var(--surface-2);border-radius:12px;padding:10px 12px;margin:0}
.tag.r{background:var(--neg-bg);color:var(--neg)}
.utxo.hl{background:var(--warn-bg);border-radius:10px}
.io{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 0;font-size:15.5px}
.io .k{min-width:0;font-weight:600}
.io .k small{display:block;font-weight:400;font-size:13px;color:var(--muted);overflow-wrap:anywhere;margin-top:1px}
.io .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
button.io:active{background:var(--surface-2)}
.ev{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;align-items:start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 0}
.ev:active{background:var(--surface-2)}
.evi{grid-row:1/4;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.evi svg{width:16px;height:16px}
.evi.in{background:var(--pos-bg);color:var(--pos)}
.evi.out{background:var(--neg-bg);color:var(--neg)}
.evt{font-weight:700;line-height:1.3;min-width:0}
.eva{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.evd{grid-column:2/4;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.evb{grid-column:2/4;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sheet h3.mini{font-family:var(--fc);font-weight:700;font-size:20px;margin:20px 0 6px}
.out{border:1.5px solid var(--line);border-radius:16px;padding:12px 12px 2px;margin:0 0 12px;background:var(--surface)}
.out-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 10px}
.out .calc-line{margin-bottom:12px}
.picker .note{font-size:14px}
.wgroup{margin:6px 0 18px}
.wg-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;border:0;background:none;padding:6px 0 8px;border-bottom:2px solid var(--ink);text-align:left}
.wg-head b{font-family:var(--fc);font-size:20px}
.wg-head span{font-size:13.5px;color:var(--muted);text-align:right}
.article h3 + .io,.article h3 + .ev,.article h3 + .utxo{border-top:1px solid var(--line)}

/* ---------- vendas e troco (v1.2) ---------- */
.tag.s{background:var(--neg-bg);color:var(--neg)}
.sold-box{margin:12px 0 0;padding:12px 14px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.sold-box .receipt li{padding:7px 0}
.chart .sale{fill:var(--neg);stroke:var(--bg);stroke-width:1.5}
.chart-legend i.s{width:9px;height:9px;border-radius:50%;background:var(--neg);vertical-align:0}
.io .v small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);text-align:right}
.out.rem{border-color:var(--orange)}

/* ---------- endereços de recebimento e de troco (v1.3) ---------- */
.agroup{margin:8px 0 6px}
.ag-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0 4px;border-bottom:1px solid var(--line)}
.ag-head b{font-size:14px;font-weight:700}
.ag-head span{font-size:12.5px;color:var(--muted);text-align:right}
.agroup .link-btn{margin-top:6px}
.err.form .btn-row .btn{flex:0 1 auto}
.article .agroup{margin-top:16px}

/* ---------- barra de UTXOs (v1.6) ---------- */
.tools3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 10px}
.tools3 .btn{min-height:42px;font-size:14px;padding:0 8px}

/* ---------- taxa do aporte (v1.8) ---------- */
.fee-in{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.fee-in .seg{margin:0;min-width:110px}
/* ---------- importação pela chave pública (v1.8) ---------- */
.xi-warn ul{margin:6px 0 0;padding-left:18px}
.xi-warn li{margin:6px 0}
.xi-wait{font-size:13.5px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 10px;margin:2px 0 10px}
.xi-bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0 10px}
.xi-bar span{display:block;height:100%;width:35%;border-radius:999px;background:var(--orange);animation:xiMove 1.3s ease-in-out infinite}
@keyframes xiMove{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){.xi-bar span{animation:none;width:100%;opacity:.5}}
.xi-row{padding:10px 0;border-bottom:1px solid var(--line)}
.xi-a{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:6px;font-size:13px}
.xi-i{font-weight:700;color:var(--muted);min-width:30px}
.xi-v{color:var(--muted)}
.xi-u{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.xi-u .small{display:block}
.xi-u select{min-width:160px}
/* ---------- status da mempool (v1.8) ---------- */
.mp-row{display:grid;grid-template-columns:1fr 1fr 6px 1fr;gap:8px;align-items:end;margin-top:4px}
.mp-col{display:flex;flex-direction:column;align-items:center;min-width:0}
.mp-top{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;white-space:nowrap}
.mp-blk{position:relative;width:calc(100% - 8px);aspect-ratio:1/1;margin:8px 8px 0 0;padding:6px 4px;border-radius:2px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;font-size:11px;line-height:1.2;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.mp-blk::before{content:"";position:absolute;left:0;top:-8px;width:100%;height:8px;background:inherit;filter:brightness(1.3);transform:skewX(-45deg);transform-origin:bottom left}
.mp-blk::after{content:"";position:absolute;top:0;right:-8px;width:8px;height:100%;background:inherit;filter:brightness(.7);transform:skewY(-45deg);transform-origin:top left}
.mp-blk b{font-size:13px}
.mp-blk .mp-n{font-weight:600}
.mp-blk .mp-eta{opacity:.95;margin-top:2px}
.mp-blk .mp-pool{font-size:10px;opacity:.85}
.mp-blk.mined{background:linear-gradient(#9339f4,#105fb0)}
.mp-sep{align-self:stretch;border-left:2px dashed var(--muted);opacity:.5;margin-top:22px}
.mp-leg{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:8px;font-size:11.5px;color:var(--muted);text-align:center}

/* ---------- 1.8.4: topo laranja nos dois temas, sem creme; texto sobre o laranja sempre preto ---------- */
.top,.hero{--ink:#000;--muted:#47290A;--line:rgba(0,0,0,.22);--focus:#000;--pos-bg:var(--hero-chip);--neg-bg:var(--hero-chip);color:#000}
.hero .btn-p{background:var(--cta);color:var(--on-cta)}
.hero .btn-p:active{background:#2B2B2B}
.hero .btn-o{border-color:#000;color:#000}
.hero .chip.neutral{background:var(--hero-chip);color:var(--hero-chip-ink)}
.hero .link-btn{text-decoration-color:#000}
.brand img{width:40px;height:40px;object-fit:contain;padding:4px;box-sizing:border-box;background:#000;border-radius:50%}

/* histórico de meses: cartão abaixo do topo, estados claros e dica por mês */
.months-card{margin:14px 14px 0;padding:14px 14px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.mc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mc-head .sec-t{margin:0}
.mc-sum{font-size:13px;color:var(--muted)}
.mgrid{position:relative;margin-top:10px;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mgrid-ml,.mgrid-row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.mgrid-ml span{font-family:var(--fc);font-size:12px;font-weight:600;text-align:center;color:var(--muted)}
.mgrid-yh{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 5px}
.mgrid-yh .yl{font-family:var(--fc);font-size:16px;font-weight:700}
.mgrid-yh .ys{font-size:12.5px;color:var(--muted)}
.cell{aspect-ratio:1;border-radius:7px;border:0;background:transparent;padding:0;position:relative;min-width:0;display:grid;place-items:center;color:inherit}
.cell svg{width:58%;height:58%;pointer-events:none}
.cell.done{background:var(--orange);color:#000}
.cell.miss{background:var(--cell-miss);color:var(--cell-miss-ink)}
.cell.miss svg{width:44%;height:44%}
.cell.pend{border:2px dashed var(--orange);animation:pulse 2.4s ease-in-out infinite}
.cell.pend::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange)}
.cell.future{border:1.5px dotted var(--cell-fut)}
.cell.tip-on{box-shadow:0 0 0 2px var(--ink)}
.mtip{position:absolute;z-index:6;pointer-events:none;width:180px;transform:translateX(-50%);padding:7px 10px;border-radius:10px;text-align:center;line-height:1.25;background:var(--tip-bg);color:var(--tip-ink);box-shadow:0 6px 18px rgba(0,0,0,.28)}
.mtip b{display:block;font-size:14px}
.mtip span{display:block;font-size:13px}
.mtip i{position:absolute;bottom:-5px;left:50%;width:10px;height:10px;background:var(--tip-bg);transform:translateX(-50%) rotate(45deg)}
.months-card .months-foot{margin:12px 0 0}
.legend{flex-wrap:wrap}
.legend i{border:0}
.legend i.d{background:var(--orange)}
.legend i.x{background:var(--cell-miss)}
.legend i.p{border:2px dashed var(--orange);box-sizing:border-box}
.mc-hint{margin:6px 0 0;font-size:13px;color:var(--muted)}

/* botão +: aporte, saque ou transação */
.plus-seg{margin:4px 44px 14px 0}
.plus-seg button{font-size:15.5px;font-weight:700}
.sheet.still{animation:none}
.ov.still{animation:none}
a.set-row{color:inherit;text-decoration:none}
.ob-x{margin:14px 2px 0}
.ptx-coin{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 2px;text-align:left;font-size:15px;color:var(--ink)}
.ptx-coin .ck{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;box-sizing:border-box}
.ptx-coin.on .ck{background:var(--orange);border-color:var(--orange)}
.ptx-coin.on .ck::after{content:"";width:5px;height:10px;border:solid #000;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.ptx-coin .a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptx-coin .a small{display:block;font-size:12.5px;color:var(--muted)}

/* cotação do bitcoin no topo do Início (1.8.5) */
.hero-price{position:relative;display:block;width:100%;margin:14px 0 0;padding:10px 26px 2px 0;border:0;border-top:1px solid rgba(0,0,0,.2);background:none;color:#000;font:inherit;text-align:left}
.hero-price .pv{display:flex;align-items:baseline;gap:8px}
.hero-price .k{font-size:14.5px;color:var(--muted)}
.hero-price b{font-family:var(--fc);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.hero-price .a{display:block;font-size:13px;color:var(--muted)}
.hero-price .chev{position:absolute;right:2px;top:50%;transform:translateY(-35%);font-size:24px;line-height:1}

/* botão Atualizar da mempool (1.8.6): afunda ao toque, gira enquanto busca e confirma o resultado */
.sec-head .mp-btn{align-self:center}
.mp-ex{margin:2px 0 6px;font-size:12.5px;color:var(--muted)}
.mp-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:124px;min-height:40px;padding:0 8px;white-space:nowrap;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;transition:transform .08s ease,background-color .15s ease,border-color .15s ease,color .15s ease;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.mp-btn svg{flex:none}
.mp-btn:active{transform:scale(.93);background:var(--surface-2);border-color:var(--ink)}
.mp-btn.busy{background:var(--warn-bg);border-color:var(--orange);cursor:progress;transform:scale(.97)}
.mp-btn.busy svg{animation:mpSpin .75s linear infinite}
.mp-btn.ok{background:var(--pos-bg);border-color:var(--pos);color:var(--pos)}
.mp-btn.err{background:var(--neg-bg);border-color:var(--neg);color:var(--neg)}
@keyframes mpSpin{to{transform:rotate(360deg)}}
.mp-row{border-radius:12px}
.mp-row.flash{animation:mpFlash 1.3s ease-out}
@keyframes mpFlash{0%{box-shadow:0 0 0 4px var(--orange);background:var(--warn-bg)}100%{box-shadow:0 0 0 4px transparent;background:transparent}}
/* aviso na confirmação de backup (1.8.9): campos corrigidos e servidor da importação */
.restore-warn{background:var(--warn-bg);color:var(--ink);margin:0 0 14px;overflow-wrap:anywhere}
.restore-warn b{color:var(--warn)}

.ic{display:block;width:24px;height:24px}
</style>
</head>

/* ---------------- utilidades ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const round2 = v => Math.round(v * 100) / 100;
const byId = (arr, id) => arr.find(x => x.id === id);
const pad2 = n => String(n).padStart(2, '0');
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function nowYM() { return todayISO().slice(0, 7); }
function fmtDate(iso) { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }
function fmtYM(ym) { const [y, m] = ym.split('-'); return `${MONTHS[+m - 1]}/${y}`; }
function monthAdd(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad2(m)}`; }
function lastDay(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
const nfInt = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
const fmtSats = s => nfInt.format(Math.round(s));
const fmtBTC = s => (s / 1e8).toLocaleString('pt-BR', { minimumFractionDigits: 8, maximumFractionDigits: 8 });

/* ---------------- botão Voltar (1.8.12) ----------------
   O Voltar do Android (e o do navegador) volta um passo dentro do app em vez de fechá-lo. Cada nível aberto por cima do
   Início ganha uma entrada no histórico, no mesmo endereço ({ hb100: 1, d: profundidade }): outra aba, cada página
   e a folha com X (a que veio das Configurações conta dois níveis). As entradas nascem no toque que abre o nível: o Chrome
   ignora no Voltar as entradas criadas sem toque, por isso o app nunca cria entrada ao tratar um Voltar, só consome.
   No Voltar, o app volta um passo: fecha a folha (a que veio das Configurações volta para elas), volta à página anterior
   ou ao Início. Quando um nível fecha por outro caminho (X, salvar, seta da página), as entradas a mais saem do histórico

function histSync() {

  for (let n = backLevels() - histDepth(); n > 0 && !ui.locked; n--) { const antes = backLevels(); goBack(); if (backLevels() >= antes) break; }

  const ins = sp.inputs.map(id => byId(state.utxos, id)).filter(Boolean), wIn = new Set(ins.map(u => u.wallet));

function txSaveSafe() {
  if (ui.form && ui.form.tx && ui.form.tx.simple) return consSave();
  txRead();
  const t = ui.form && ui.form.tx; if (!t) return;
  for (const [i, o] of t.outputs.entries()) {

    if (v < d) return formErr(`A saída ${i + 1} tem ${amtTxt(v)}, abaixo do limite de poeira da rede (${fmtSats(d)} sats para esse tipo de endereço).`);
  }
  const n = txCalc();

  t.dustOk = false;

}

  }

    const date = '2026-03-15', ins = [made[0], made[1]], dest = mkA(hw, 'Cofre principal', date), sid = uid();
    const vsize = Math.ceil(VB.ovh + 68 * 2 + 31), fee = 3 * vsize, sats = ins[0].sats + ins[1].sats - fee;

  const fr = x.feeRange || [], lo = fr.length ? fr[0] : x.medianFee, hi = fr.length ? fr[fr.length - 1] : x.medianFee;
  return `<div class="mp-col"><span class="mp-top">${title}</span><div class="mp-blk" style="background:linear-gradient(${mpColor(hi)},${mpColor(lo)})">
    <b>~${mpR(x.medianFee)} sat/vB</b><span>${mpR(lo)}–${mpR(hi)} sat/vB</span><span class="mp-n">${esc(fmtSats(x.nTx))} transações</span><span>${esc((x.blockVSize / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 2 }))} MvB</span><span class="mp-eta">${eta}</span></div></div>`;
}
function mpMinedHTML(t) {
  const e = t.extras || {}, fr = e.feeRange || [], lo = fr.length ? fr[0] : null;
  return `<div class="mp-col"><span class="mp-top">#${esc(fmtSats(t.height))}</span><div class="mp-blk mined">
    <b>~${mpR(e.medianFee)} sat/vB</b><span>mín. ${lo != null ? mpR(lo) : '—'} sat/vB</span><span class="mp-n">${esc(fmtSats(t.tx_count))} transações</span><span class="mp-eta">${mpAgo(t.timestamp)}</span>${e.pool && e.pool.name ? `<span class="mp-pool">${esc(e.pool.name)}</span>` : ''}</div></div>`;
}
function mempoolHTML() {
  const head = extra => `<div class="sec-head"><h2 class="sec-t">Status da mempool</h2>${extra || ''}</div>`;
  if (!IN_CLAUDE && S().offline) return `<section class="sec" id="mempool">${head()}<p class="note">Modo 100% offline: o app não consulta a mempool.</p></section>`;
  const d = IN_CLAUDE ? mpExample() : mp;
  if (!d.next || !d.tip) return `<section class="sec" id="mempool">${head(mpBtnHTML())}<p class="small muted">${mp.btn === 'busy' || !mp.err ? 'Carregando a mempool…' : esc(mp.err)}</p></section>`;
  const [a, b] = d.next, old = !IN_CLAUDE && Date.now() - mp.at > 120000;
  return `<section class="sec" id="mempool">${head(mpBtnHTML())}${IN_CLAUDE ? '<p class="mp-ex"><span class="tag">exemplo</span> dados ilustrativos desta prévia</p>' : ''}
    <div class="mp-row${mp.flash ? ' flash' : ''}">${b ? mpBlockHTML(b, '2º da fila', 'em ~20 min') : '<div></div>'}${mpBlockHTML(a, 'Próximo bloco', 'em ~10 min')}<div class="mp-sep" aria-hidden="true"></div>${mpMinedHTML(d.tip)}</div>
    <div class="mp-leg"><span>Na fila, ainda não minerados</span><span>Último minerado</span></div>
    <p class="hint" style="margin-top:8px">${IN_CLAUDE ? 'Exemplo ilustrativo: nesta prévia o app não acessa a internet. No app instalado, os dados vêm do mempool.space e se atualizam sozinhos.' : `Dados do mempool.space · atualizado às ${esc(mpHora(mp.at))}${old ? ` (${esc(mpAgo(Math.floor(mp.at / 1000)))})` : ''}. O "~" é a taxa típica (mediana) de cada bloco.`}</p></section>`;
}
ACT['mp-refresh'] = () => mpManual();

/* ---------- câmbio: valores em R$ ou em US$ (1.8.6) ----------
   Os aportes continuam registrados na moeda dos aportes (cur()). Em Configurações › Exibição, "Moeda dos valores" mostra
   tudo na outra moeda do par R$/US$ (vcur()): cotação, pilha, total aportado, preço médio, resultado e cada aporte.
   Cada valor é convertido pelo dólar do dia da operação: PTAX de venda do Banco Central (série SGS 1; fim de semana e
   feriado usam o último dia útil antes), com o BCE (Frankfurter) de reserva. O app busca sozinho quando está online e
   guarda no aparelho, fora do backup (é dado público). Sem o dólar do dia (modo offline, prévia ou falha na rede), vale a
   PTAX média do mês, já embutida no hist.json (brl ÷ usd); no mês corrente, o dólar mais recente conhecido.
   O app nunca pede a cotação do dólar. O relatório do IR fica sempre em reais. */
const FX_KEY = 'fx', FX_LS = 'holdbtc100:fx', FX_PAIR = ['BRL', 'USD'];
const fxEmpty = () => ({ v: 1, src: '', d: {}, from: '', to: '', chk: 0, bcbTry: 0 });
let fx = fxEmpty();                       // d: { 'AAAA-MM-DD': reais por dólar }
const fxSt = { p: null, err: '', failAt: 0 };
const fxPairOk = () => FX_PAIR.includes(cur());
const vcur = () => { const v = S().viewCur, c = cur(); return v && v !== c && FX_PAIR.includes(v) && FX_PAIR.includes(c) ? v : c; };
const fxOn = () => vcur() !== cur();

/* datas em ISO (AAAA-MM-DD), sem fuso: meio-dia UTC evita o horário de verão */
const isoAdd = (iso, n) => { const t = new Date(iso + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const isoOf = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const isoDays = (a, b) => Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 86400000);
const dmy = iso => iso.split('-').reverse().join('/');

/* dólar do dia: o da própria data ou o do último dia útil antes dela (até 10 dias) */
function fxDay(date) {
  let k = date;
  for (let i = 0; i < 10; i++, k = isoAdd(k, -1)) { const r = fx.d[k]; if (r > 0) return { r, ref: k, kind: fx.src === 'BCE' ? 'bce' : 'ptax' }; }
  return null;
}
/* PTAX média do mês, embutida no hist.json (preço em R$ ÷ preço em US$ do mesmo mês) */
function fxMonth(ym) { const i = histIdx(ym); return i >= 0 && i < HIST.usd.length && HIST.usd[i] > 0 && HIST.brl[i] > 0 ? HIST.brl[i] / HIST.usd[i] : null; }
/* dólar de hoje informado à mão: opcional e só no modo 100% offline (1.8.7) */
const fxMan = () => { const x = state.fxm; return S().offline && x && x.r > 0 ? { r: x.r, ref: isoOf(x.at), kind: 'man' } : null; };
/* dólar de hoje: no modo offline, o informado à mão (se não houver PTAX mais nova); PTAX dos últimos dias; senão, o que as cotações do bitcoin em R$ e US$ indicam; senão, o mais recente
   conhecido (o do cache ou o da cotação de referência embutida, que usa a PTAX da data dela) */
function fxToday() {
  const t = todayISO(), d = fxDay(t), m = fxMan();
  if (m && !(d && d.ref > m.ref)) return m;
  if (d && isoDays(d.ref, t) <= 5) return d;
  const p = state.price;
  if (p.src && p.src !== 'ref' && p.src !== 'manual' && p.BRL > 0 && p.USD > 0 && Date.now() - p.at < 3 * 86400000) return { r: p.BRL / p.USD, ref: isoOf(p.at), kind: 'cot' };
  const last = fx.to && fx.d[fx.to] > 0 ? { r: fx.d[fx.to], ref: fx.to, kind: fx.src === 'BCE' ? 'bce' : 'ptax' } : null, refD = isoOf(REF_PRICE.at);
  if (last && last.ref >= refD) return last;
  return { r: REF_PRICE.BRL / REF_PRICE.USD, ref: refD, kind: 'ref' };
}
/* dólar usado para um registro: do dia (PTAX/BCE), média do mês ou estimativa */
function fxAt(date) {
  const d = fxDay(date); if (d) return d;
  const ym = date.slice(0, 7), m = ym < nowYM() ? fxMonth(ym) : null;
  if (m) return { r: m, ref: ym, kind: 'mes' };
  if (ym < HIST.start) return { r: fxMonth(HIST.start) || fxToday().r, ref: HIST.start, kind: 'est' };
  const t = fxToday(); return { r: t.r, ref: t.ref, kind: t.kind === 'man' ? 'man' : 'est' };
}
/* dólar de um registro: no modo 100% offline, o informado à mão no próprio aporte ou venda (1.8.8); senão, o da data */
function fxOf(a) { return S().offline && a.dolar > 0 ? { r: a.dolar, ref: a.date, kind: 'apm' } : fxAt(a.date); }
const fxExact = x => x.kind === 'ptax' || x.kind === 'bce';
function fxLabel(x) {
  if (x.kind === 'ptax') return `PTAX de ${fmtDate(x.ref)}`;
  if (x.kind === 'bce') return `BCE de ${fmtDate(x.ref)}`;
  if (x.kind === 'mes') return `média de ${fmtYM(x.ref)}`;
  if (x.kind === 'cot') return 'pelas cotações do bitcoin em R$ e US$';
  if (x.kind === 'ref') return `referência de ${fmtDate(x.ref)}`;
  if (x.kind === 'man') return `informado por você em ${fmtDate(x.ref)}`;
  if (x.kind === 'apm') return 'informado por você';
  return 'estimativa';
}
const fmtFx = (r, dec = 2) => fmtMoney(r, 'BRL', dec);
/* "dólar R$ 4,97" (do dia) ou "dólar ≈ R$ 4,93 (média do mês)" */
const fxApprox = x => x.kind === 'mes' || x.kind === 'est';
const fxShort = x => `dólar ${fxApprox(x) ? '≈ ' : ''}${fmtFx(x.r)}${x.kind === 'mes' ? ' (média do mês)' : x.kind === 'est' ? ' (estimativa)' : x.kind === 'man' || x.kind === 'apm' ? ' (informado)' : ''}`;

/* conversão da moeda dos aportes para a moeda de exibição */
const fxK = x => cur() === 'BRL' ? 1 / x.r : x.r;
function toV(v, date) { return fxOn() && v ? v * fxK(fxAt(date)) : v; }
function toVa(a, v) { return fxOn() && v ? v * fxK(fxOf(a)) : v; }   // valor de um registro, pelo dólar dele
function toVnow(v) { return fxOn() && v ? v * fxK(fxToday()) : v; }
function apV(a) { if (!fxOn()) return a; const x = fxOf(a), k = fxK(x); return { ...a, fiat: a.fiat * k, price: a.price * k, fee: (a.fee || 0) * k, fx: x }; }
const MV = (v, dec = 2) => priv(fmtMoney(v, vcur(), dec));
const fmtV = (v, dec = 2) => fmtMoney(v, vcur(), dec);

/* quantos registros usam o dólar do dia, a média do mês ou uma estimativa */
function fxStats() {
  const s = { day: 0, mes: 0, man: 0, est: 0, n: state.aportes.length };
  for (const a of state.aportes) { const k = fxOf(a).kind; if (k === 'ptax' || k === 'bce') s.day++; else if (k === 'mes') s.mes++; else if (k === 'man' || k === 'apm') s.man++; else s.est++; }
  return s;
}
function fxWhy() {
  if (S().offline) return 'No modo 100% offline o app não busca o dólar do dia. Se quiser, informe o dólar no próprio aporte e, para o mês atual, na cotação.';
  if (IN_CLAUDE) return 'Nesta prévia o app não acessa a internet; no app instalado, o dólar do dia vem do Banco Central.';
  if (fxSt.p) return 'Buscando o dólar do dia…';
  return fxSt.err || 'O app busca o dólar do dia quando estiver online.';
}
/* o que ainda não usa o dólar do dia, e por quê (vazio quando todos usam) */
function fxPending() {
  const s = fxStats(); if (!s.n || s.day === s.n) return '';
  const p = [];
  if (s.mes) p.push(`${s.mes} pela média do mês`);
  if (s.man) p.push(`${s.man} pelo dólar que você informou`);
  if (s.est) p.push(`${s.est} por estimativa`);
  return `${s.day ? `Por enquanto, ${s.day} com o dólar do dia e ` : 'Por enquanto, '}${p.join(' e ')}. ${fxWhy()}`;
}
const fxSrcName = () => fx.src === 'BCE' ? 'BCE, o Banco Central Europeu' : 'PTAX do Banco Central';
/* nota do Início e dos Aportes */
function fxNote() {
  if (!fxOn() || !state.aportes.length) return '';
  const pend = fxPending();
  return `<p class="hint fx-note">Valores em ${vcur() === 'USD' ? 'US$' : 'R$'}: cada aporte e venda convertido pelo dólar do dia da operação (${esc(fxSrcName())}), sem você informar nada.${pend ? ' ' + esc(pend) : ''}</p>`;
}

/* ---------- busca do dólar (só online, fora da prévia e com a exibição na outra moeda) ---------- */
async function fxFetch(url) { const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000); try { return await fetch(url, { signal: ctl.signal, cache: 'no-store' }); } finally { clearTimeout(t); } }
const fxOk = v => v > 0.5 && v < 50;
/* Banco Central, série 1 (PTAX de venda). Séries diárias pedem dataInicial e dataFinal, com no máximo 10 anos por consulta. */
async function fxBCB(a, b) {
  const out = {};
  for (let s = a; s <= b;) {
    const e = isoAdd(s, 3000) < b ? isoAdd(s, 3000) : b;
    const r = await fxFetch(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.1/dados?formato=json&dataInicial=${dmy(s)}&dataFinal=${dmy(e)}`);
    if (r.status === 404 && isoDays(s, e) <= 10) { s = isoAdd(e, 1); continue; }   // período curto sem cotação (fim de semana, feriado)
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(); if (!Array.isArray(j)) throw new Error('formato');
    for (const it of j) { const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(it && it.data)), v = parseFloat(it && it.valor); if (m && fxOk(v)) out[`${m[3]}-${m[2]}-${m[1]}`] = v; }
    s = isoAdd(e, 1);
  }
  if (!Object.keys(out).length && isoDays(a, b) > 10) throw new Error('vazio');
  return out;
}
/* reserva: taxas de referência do BCE (Frankfurter), cruzadas para reais por dólar */
async function fxECB(a, b) {
  const r = await fxFetch(`https://api.frankfurter.dev/v1/${a}..${b}?base=USD&symbols=BRL`);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json(), out = {};
  for (const [k, o] of Object.entries((j && j.rates) || {})) { const v = o && +o.BRL; if (/^\d{4}-\d{2}-\d{2}$/.test(k) && fxOk(v)) out[k] = v; }
  if (!Object.keys(out).length && isoDays(a, b) > 10) throw new Error('vazio');
  return out;
}
/* Busca o que falta: o período todo (de FX_FROM até hoje) quando ainda não há, ou só os dias novos. A janela é fixa
   (1.8.9): o pedido não depende dos registros, e quem responde não fica sabendo desde quando a pessoa compra.
   Se o Banco Central falhar, usa o BCE; tenta o Banco Central de novo depois de 12 h. */
const FX_FROM = '2009-12-20';
function fxSync(force = false) {
  if (!fxOn() || IN_CLAUDE || !NET() || !state.aportes.length) return Promise.resolve(false);
  if (fxSt.p) return fxSt.p;
  const now = Date.now();
  if (!force && now - fxSt.failAt < 10 * 60000) return Promise.resolve(false);
  const from = FX_FROM, today = todayISO();
  const covered = !!fx.from && fx.from <= from;
  const full = !covered || (fx.src !== 'BCB' && now - (fx.bcbTry || 0) > 12 * 3600000);
  const tail = !full && fx.to < today && (force || now - (fx.chk || 0) > 3 * 3600000);
  if (!full && !tail) return Promise.resolve(false);
  fxSt.p = (async () => {
    const a = full ? from : isoAdd(fx.to, -3);
    let got = null, src = 'BCB';
    if (full || fx.src === 'BCB') { try { got = await fxBCB(a, today); } catch (e) { fx.bcbTry = now; } }
    if (!got && (!covered || fx.src !== 'BCB')) {   // reserva: BCE; se o cache já é do BCE, só os dias novos
      try { got = await fxECB(covered && fx.src === 'BCE' ? isoAdd(fx.to || from, -3) : a, today); src = 'BCE'; } catch (e) { }
    }
    if (got) {
      if (src !== fx.src) fx = { ...fxEmpty(), src, d: got, from: a, bcbTry: fx.bcbTry };
      else Object.assign(fx.d, got);
      if (!fx.from || a < fx.from) fx.from = a;
      fx.to = Object.keys(fx.d).reduce((m, k) => k > m ? k : m, ''); fx.chk = now; fxSt.err = ''; fxSt.failAt = 0;
      await fxSave(); return true;
    }
    fxSt.failAt = now; fxSt.err = 'Não deu para buscar o dólar do dia agora. O app tenta de novo daqui a pouco.';
    return false;
  })().catch(() => false);
  return fxSt.p.finally(() => { fxSt.p = null; render(); refreshSheet(); });
}
async function fxLoad() {
  const ok = v => v && typeof v === 'object' && v.d && typeof v.d === 'object';
  try { if (idb) { const v = await idbGet(FX_KEY); if (ok(v)) { fx = { ...fxEmpty(), ...v }; return; } } } catch (e) { }
  try { const s = localStorage.getItem(FX_LS); if (s) { const v = JSON.parse(s); if (ok(v)) fx = { ...fxEmpty(), ...v }; } } catch (e) { }
}
async function fxSave() {
  const data = JSON.parse(JSON.stringify(fx));
  try { if (idb) { await idbSet(FX_KEY, data); return; } } catch (e) { }
  try { localStorage.setItem(FX_LS, JSON.stringify(data)); } catch (e) { }
}

/* ---------- telas ---------- */
/* Configurações › Exibição */
function viewCurField() {
  if (!fxPairOk()) return `<div class="field"><span class="lbl">Moeda dos valores</span><p class="small muted" style="margin:0">Com registros em €, os valores aparecem em €. A troca entre R$ e US$ vale para registros em reais ou em dólar.</p></div>`;
  const v = vcur(), base = cur(), sym = c => c === 'USD' ? 'US$' : 'R$', pend = fxPending();
  const hint = fxOn() ? `Seus aportes continuam registrados em ${sym(base)}. Em ${sym(v)}, cada valor é convertido pelo dólar do dia da operação (${esc(fxSrcName())}), que o app busca sozinho.${pend ? ' ' + esc(pend) : ''}`
    : `Em ${sym(base === 'BRL' ? 'USD' : 'BRL')}, a cotação, a pilha, o total aportado e cada aporte aparecem convertidos pelo dólar do dia de cada operação. Você não precisa informar o dólar.`;
  return `<div class="field"><span class="lbl">Moeda dos valores</span><div class="seg" role="group" aria-label="Moeda dos valores">${[['BRL', 'R$ (real)'], ['USD', 'US$ (dólar)']].map(([c, l]) => `<button class="${v === c ? 'on' : ''}" data-act="set-view" data-v="${c}" aria-pressed="${v === c}">${l}</button>`).join('')}</div><p class="hint" id="fx-hint">${hint}</p></div>`;
}
/* linha "Dólar hoje" (Início e cotação) */
function fxTodayRow() {
  if (!fxOn()) return '';
  const t = fxToday();
  return `<li><span class="k">Dólar hoje</span><span class="dots"></span><button class="v" data-act="price-sheet">${esc(fmtFx(t.r))}<small>${esc(fxLabel(t))}</small></button></li>`;
}
/* linha extra no formulário de aporte e venda: quanto fica na moeda de exibição */
function apFxLine(fiat, date) {
  if (!fxOn() || !(Math.abs(fiat) > 0)) return '';
  const dv = apDolTyped(), x = dv ? { r: dv, ref: '', kind: 'apm' } : fxAt(/^\d{4}-\d{2}-\d{2}$/.test(date || '') ? date : todayISO());
  return `<br><span class="small muted">Equivale a ${fxApprox(x) ? '≈ ' : ''}${esc(fmtV(Math.abs(fiat) * fxK(x)))} (dólar a ${esc(fmtFx(x.r))}, ${esc(fxLabel(x))})</span>`;
}
/* modo offline: campo opcional "Dólar de hoje" na cotação, só com os valores na outra moeda (1.8.7) */
function fxManField() {
  if (!S().offline || !fxOn()) return '';
  const m = state.fxm && state.fxm.r > 0 ? state.fxm : null, t = fxToday();
  return `<div class="field"><label for="f-md">Dólar de hoje, em reais (opcional)</label><input class="inp" id="f-md" name="mdolar" inputmode="decimal" data-num="dec" data-dec="4" autocomplete="off" placeholder="${esc(fmtInput(t.r, 4))}" value="${m ? esc(fmtInput(m.r, 4)) : ''}">
    <p class="hint">Quanto custa US$ 1. Vale para o mês atual e para a cotação em US$; os meses passados usam a PTAX média do mês. ${m ? `Informado em ${esc(fmtDate(isoOf(m.at)))}. Apague para voltar ao dólar que o app estima.` : `Em branco, o app usa ${esc(fmtFx(t.r, 4))} (${esc(fxLabel(t))}).`}</p></div>`;
}
/* guarda o dólar informado (0 apaga) e ajusta a cotação do bitcoin na outra moeda a esse dólar */
function fxManSet(r) {
  if (!(r > 0)) { state.fxm = null; return; }
  const p = state.price; state.fxm = { r: Math.round(r * 1e4) / 1e4, at: Date.now() };
  if (cur() === 'BRL') { const u = Math.round(p.BRL / state.fxm.r); if (p.USD > 0) p.EUR = Math.round(p.EUR * u / p.USD); p.USD = u; }
  else if (cur() === 'USD') p.BRL = Math.round(p.USD * state.fxm.r);
}
/* formulário de aporte e venda, no modo offline com os valores na outra moeda: dólar daquele dia, opcional (1.8.8) */
const apDolTyped = () => { const el = $('#f-dol'), v = el ? parseNum(el.value) : NaN; return v >= 1 && v <= 20 ? v : 0; };
function apDolHint(date) {
  const x = fxAt(/^\d{4}-\d{2}-\d{2}$/.test(date || '') ? date : todayISO());
  return { ph: fmtInput(x.r, 4), txt: `Quanto custava US$ 1 nesse dia, se você souber (comprovante ou extrato). Em branco, o app usa ${fmtFx(x.r, 4)} (${fxLabel(x)}). Vale no modo offline; online, vale a PTAX do dia.` };
}
function apDolField(d, sale) {
  if (!S().offline || !fxOn()) return '';
  const h = apDolHint(d.date);
  return `<div class="field"><label for="f-dol">Dólar no dia da ${sale ? 'venda' : 'compra'}, em reais (opcional)</label><input class="inp" id="f-dol" name="dolar" inputmode="decimal" data-num="dec" data-dec="4" autocomplete="off" placeholder="${esc(h.ph)}" value="${esc(d.dolar || '')}" data-inp="ap-calc"><p class="hint" id="dol-hint">${esc(h.txt)}</p></div>`;
}
function apDolSync() { const el = $('#f-dol'), hi = $('#dol-hint'); if (!el || !hi) return; const h = apDolHint(fv('date')); el.placeholder = h.ph; hi.textContent = h.txt; }
Object.assign(ACT, {
  'set-view': el => {
    const v = el.dataset.v; if (!FX_PAIR.includes(v) || !fxPairOk()) return;
    S().viewCur = v; ui.sim = null; save(); render(); refreshSheet();
    toast(v === 'USD' ? 'Valores em dólar (US$)' : 'Valores em reais (R$)');
    fxSync(true);
  }
});


init();

</script>
